services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grokbot
      POSTGRES_PASSWORD: grokbot
      POSTGRES_DB: grokbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grokbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn grokbot.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://grokbot:grokbot@postgres:5432/grokbot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  worker:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             celery -A grokbot worker -l info -c 2"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://grokbot:grokbot@postgres:5432/grokbot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  beat:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             celery -A grokbot beat -l info"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://grokbot:grokbot@postgres:5432/grokbot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - worker
    volumes:
      - .:/app

volumes:
  pgdata:
